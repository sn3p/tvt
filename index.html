<!doctype html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TVT — Tellingen als punten</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script defer type="module" src="./main.js"></script>
</head>

<body>
  <header class="topbar" role="banner">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-title">TVT</div>
        <a class="brand-link" href="./old/" rel="noreferrer">/old</a>
      </div>

      <nav class="modes" aria-label="Modus">
        <button id="modePointsBtn" class="mode-btn" type="button" aria-pressed="true">Tellingen</button>
        <button id="modeSpeciesBtn" class="mode-btn" type="button" aria-pressed="false">Soorten</button>
      </nav>

      <form id="filtersForm" class="filters" autocomplete="off">
        <label class="field">
          <span>Jaar</span>
          <input id="yearInput" name="year" type="number" min="2010" max="2100" step="1" value="2026" />
        </label>

        <label class="field">
          <span>PC4</span>
          <input id="pc4Input" name="pc4" type="text" inputmode="numeric" placeholder="(alle)" minlength="4"
            maxlength="4" pattern="[0-9]{4}" />
        </label>

        <div class="check-group">
          <label class="check">
            <input id="includeType1Input" name="includeType1" type="checkbox" checked />
            <span>Inzending</span>
          </label>

          <label class="check">
            <input id="includeIsorgInput" name="includeIsorg" type="checkbox" checked />
            <span>Schoolinzending</span>
          </label>
        </div>
      </form>

      <div id="statsBar" class="stats muted" aria-live="polite"></div>
    </div>
  </header>

  <main class="main" role="main">
    <aside id="sidebar" class="sidebar" aria-label="Soorten" hidden>
      <div class="sidebar-header">
        <div class="sidebar-title">Soort</div>
        <div id="speciesStatus" class="sidebar-status muted"></div>
      </div>

      <div class="sidebar-controls">
        <label class="sidebar-search">
          <span class="muted">Zoek</span>
          <input id="speciesSearchInput" type="search" placeholder="Typ een soort…" />
        </label>

        <div class="sidebar-row">
          <div class="sidebar-label muted">Scope</div>
          <div class="segmented" role="group" aria-label="Scope">
            <label class="seg">
              <input id="speciesScopeViewport" type="radio" name="speciesScope" value="viewport" checked />
              <span>Only in viewport</span>
            </label>
            <label class="seg">
              <input id="speciesScopeAll" type="radio" name="speciesScope" value="all" />
              <span>All</span>
            </label>
          </div>
        </div>

        <div class="sidebar-row">
          <div class="sidebar-label muted">Sort</div>
          <div class="segmented" role="group" aria-label="Sorteren">
            <label class="seg">
              <input id="speciesSortMost" type="radio" name="speciesSort" value="most" checked />
              <span>Most observed</span>
            </label>
            <label class="seg">
              <input id="speciesSortAZ" type="radio" name="speciesSort" value="az" />
              <span>A–Z</span>
            </label>
          </div>
        </div>

        <div class="sidebar-row">
          <div class="sidebar-label muted">Metric</div>
          <div class="segmented" role="group" aria-label="Metric">
            <label class="seg">
              <input id="metricPresence" type="radio" name="metric" value="presence" checked />
              <span>presence</span>
            </label>
            <label class="seg">
              <input id="metricAvg" type="radio" name="metric" value="avg" />
              <span>avg/telling</span>
            </label>
            <label class="seg">
              <input id="metricSum" type="radio" name="metric" value="sum" />
              <span>sum</span>
            </label>
          </div>
        </div>

        <div class="sidebar-row">
          <div class="sidebar-label muted">Style</div>
          <div class="segmented" role="group" aria-label="Render style">
            <label class="seg">
              <input id="styleAuto" type="radio" name="style" value="auto" checked />
              <span>Auto</span>
            </label>
            <label class="seg">
              <input id="styleGrid" type="radio" name="style" value="grid" />
              <span>Grid</span>
            </label>
            <label class="seg">
              <input id="styleHeatmap" type="radio" name="style" value="heatmap" />
              <span>Heatmap</span>
            </label>
          </div>
        </div>

        <div class="sidebar-row">
          <div class="sidebar-label muted">min‑N</div>
          <div class="slider">
            <input id="minNSlider" type="range" min="0" max="50" step="1" value="1" />
            <div id="minNValue" class="muted slider-value">1</div>
          </div>
        </div>

        <div class="sidebar-hint muted">
          Low N = faint (opacity scales with √N).
        </div>
      </div>

      <div id="speciesList" class="species-list" role="listbox" aria-label="Soortenlijst"></div>
    </aside>

    <section class="map-shell" aria-label="Kaart">
      <div id="map" class="map" role="application" aria-label="Leaflet kaart"></div>
    </section>
  </main>

  <footer class="meta-footer muted">
    <span>Gemaakt door <a href="https://matthijskuiper.nl" target="_blank" rel="noreferrer">Matthijs Kuiper</a>.</span>
    <span>Data/beelden: Vogelbescherming.</span>
    <span>Disclaimer: hobbyproject (niet gelieerd).</span>
  </footer>
</body>

</html>
