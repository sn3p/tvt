name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Retain pending production deploys; PR checks may supersede older PR runs.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assemble:
    name: Assemble site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble static runtime files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html main.js styles.css _site/
          cp -R src img old _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/main.js
          test -d _site/src
          grep -q 'https://tvt-api.matthijskuiper.nl/api/v1' _site/index.html
          grep -F 'http://127.0.0.1:3000/api/v1' index.html
          grep -F 'http://127.0.0.1:3000/api/v1' README.md
          if grep -nF 'http://localhost:3000/api/v1' README.md; then
            echo 'README still documents localhost:3000 as an API URL; runtime default is 127.0.0.1' >&2
            exit 1
          fi
          if grep -nF 'github.com/sn3p/tvt-api' README.md docs/data-contract.md index.html; then
            echo 'Public files must not link the private tvt-api GitHub repo' >&2
            exit 1
          fi

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
